openapi: 3.1.0
info:
  title: MetaSphere Authentication & Access Control API
  description: Authentication, session lifecycle, RBAC, and security audit logging endpoints.
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticates local username and password, returning an unguessable session token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid username or password (generic constant-time error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed login attempts; temporary account lockout

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Immediately invalidates the active bearer session token.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session invalidated successfully
        '401':
          description: Unauthenticated

  /api/v1/auth/me:
    get:
      summary: Get Current User Identity
      description: Returns profile, assigned roles, and effective calculated permissions for current user.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Unauthenticated

  /api/v1/auth/change-password:
    post:
      summary: Change Password
      description: Changes user password and immediately invalidates all active sessions for the user.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated; all sessions invalidated
        '400':
          description: Invalid password complexity or incorrect current password
        '401':
          description: Unauthenticated

  /api/v1/users:
    get:
      summary: List Users
      description: Retrieve catalog users. Requires USER_MANAGE permission.
      operationId: listUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRead'
        '403':
          description: Forbidden - lacks USER_MANAGE permission
    post:
      summary: Create User
      description: Register a new local user. Requires USER_MANAGE permission.
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '403':
          description: Forbidden

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserRead'
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    UserRead:
      type: object
      required: [id, username, email, is_active, is_superuser, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_superuser:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    UserCreate:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        full_name:
          type: string
        role_codes:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [detail, correlation_id]
      properties:
        detail:
          type: string
        correlation_id:
          type: string
