<div class="shell-container min-h-screen flex flex-col font-sans bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-40 shadow-xs">
    <div class="flex items-center gap-6">
      <a routerLink="/" class="flex items-center gap-2.5 text-blue-600 no-underline hover:opacity-90 transition-opacity">
        <i class="pi pi-database text-2xl" aria-hidden="true"></i>
        <div class="flex flex-col">
          <span class="text-base font-bold text-slate-800 leading-tight">MetaSphere</span>
          <span class="text-[10px] text-slate-400 font-medium">Enterprise Data Catalog</span>
        </div>
      </a>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 border-s border-slate-200 ps-4">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
          class="px-3 py-1.5 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-1.5 no-underline"
        >
          <i class="pi pi-chart-bar text-xs"></i>
          <span>Health</span>
        </a>

        <a
          *ngIf="authService.hasPermission('USER_MANAGE')"
          routerLink="/admin/users"
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
          class="px-3 py-1.5 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-1.5 no-underline"
        >
          <i class="pi pi-users text-xs"></i>
          <span>Users</span>
        </a>

        <a
          *ngIf="authService.hasPermission('ROLE_MANAGE')"
          routerLink="/admin/roles"
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
          class="px-3 py-1.5 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-1.5 no-underline"
        >
          <i class="pi pi-shield text-xs"></i>
          <span>Roles</span>
        </a>

        <a
          *ngIf="authService.hasPermission('AUDIT_READ')"
          routerLink="/admin/audit"
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
          class="px-3 py-1.5 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-1.5 no-underline"
        >
          <i class="pi pi-history text-xs"></i>
          <span>Audit Logs</span>
        </a>
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <!-- Direction Toggle -->
      <button
        type="button"
        (click)="directionService.toggleDirection()"
        class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-colors cursor-pointer"
        [attr.aria-label]="directionService.currentDirection() === 'rtl' ? 'Switch to English (LTR)' : 'تغییر به فارسی (RTL)'"
      >
        {{ directionService.currentDirection() === 'rtl' ? 'EN' : 'فارسی' }}
      </button>

      <!-- User Profile / Auth Status -->
      <div *ngIf="authService.currentUser() as user; else guestNav" class="flex items-center gap-2.5 border-s border-slate-200 ps-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 text-xs font-bold flex items-center justify-center uppercase">
            {{ user.username.charAt(0) }}
          </div>
          <div class="hidden sm:block text-start leading-tight">
            <div class="text-xs font-semibold text-slate-800">{{ user.username }}</div>
            <div class="text-[10px] text-slate-400 capitalize">{{ user.roles[0] || 'User' }}</div>
          </div>
        </div>
        <button
          (click)="logout()"
          title="Sign out"
          class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer"
        >
          <i class="pi pi-sign-out text-sm"></i>
        </button>
      </div>

      <ng-template #guestNav>
        <a
          routerLink="/login"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors no-underline cursor-pointer"
        >
          Sign in
        </a>
      </ng-template>
    </div>
  </header>
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <router-outlet></router-outlet>
  </main>
  <footer class="bg-white border-t border-slate-200 px-6 py-3 text-xs text-slate-500 text-center">
    MetaSphere Enterprise Data Catalog &copy; 2026 &mdash; Air-gapped On-Premises Edition
  </footer>
</div>
