<div class="shell-container min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3 rtl:space-x-reverse">
      <i class="pi pi-database text-blue-600 text-2xl" aria-hidden="true"></i>
      <span class="text-xl font-bold text-slate-800">MetaSphere Enterprise Data Catalog</span>
    </div>
    <div class="flex items-center space-x-3 rtl:space-x-reverse">
      <button
        type="button"
        (click)="directionService.toggleDirection()"
        class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 hover:bg-slate-100 transition-colors"
        [attr.aria-label]="directionService.currentDirection() === 'rtl' ? 'Switch to English (LTR)' : 'تغییر به فارسی (RTL)'"
      >
        {{ directionService.currentDirection() === 'rtl' ? 'English (LTR)' : 'فارسی (RTL)' }}
      </button>
    </div>
  </header>
  <main class="flex-1 p-6">
    <router-outlet></router-outlet>
  </main>
  <footer class="bg-white border-t border-slate-200 px-6 py-3 text-xs text-slate-500 text-center">
    MetaSphere Enterprise Data Catalog &copy; 2026 &mdash; Air-gapped On-Premises Edition
  </footer>
</div>
