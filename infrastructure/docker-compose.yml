services:
  postgres:
    image: postgres:16-alpine
    container_name: metasphere-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-metasphere}
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-metasphere}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: metasphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    name: metasphere_postgres_data
  redis_data:
    name: metasphere_redis_data
